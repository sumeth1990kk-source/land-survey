<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสำรวจข้อมูลที่ดินและแผนที่</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* สไตล์หน้าต่างป๊อปอัปสอบถาม */
        #fs-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        .modal-content {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 320px;
            width: 90%;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        .modal-content p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-yes {
            background: #1a73e8;
            color: white;
        }
        .btn-yes:hover {
            background: #1557b0;
        }
        .btn-no {
            background: #f1f3f4;
            color: #5f6368;
        }
        .btn-no:hover {
            background: #e8eaed;
        }
    </style>
</head>
<body>

    <!-- หน้าต่างป๊อปอัปสอบถามโหมดเต็มจอ -->
    <div id="fs-modal">
        <div class="modal-content">
            <h3>🖥️ เปิดโหมดเต็มหน้าจอ?</h3>
            <p>ต้องการขยายหน้าเว็บให้เต็มจอเพื่อการใช้งานที่สะดวกยิ่งขึ้นหรือไม่</p>
            <div class="modal-buttons">
                <button class="btn btn-no" onclick="closeModal()">ไม่ต้องการ</button>
                <button class="btn btn-yes" onclick="requestFullscreen()">ตกลง</button>
            </div>
        </div>
    </div>

    <div class="iframe-container">
        <!-- อนุญาตให้ใช้งาน GPS และกล้อง/ไมค์ -->
        <iframe src="https://script.google.com/macros/s/AKfycbzzsn9gUK12Rt7OuIEW7Hb9sBSBecVgGV8I4xPNcArCzlt0BexJ9OKSuLBnRiLNwuzTPg/exec" 
                allow="geolocation; camera; microphone"></iframe>
    </div>

    <script>
        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.log(err);
                });
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('fs-modal').style.display = 'none';
        }
    </script>
</body>
</html>
