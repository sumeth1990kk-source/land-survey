<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสำรวจข้อมูลที่ดินและแผนที่</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6;
        }
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* สไตล์ปุ่มกดขยายเต็มจอ */
        #fs-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 99999;
            background: #1a73e8;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <button id="fs-btn" onclick="toggleFullscreen()">🛈 เต็มจอ</button>

    <div class="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbzzsn9gUK12Rt7OuIEW7Hb9sBSBecVgGV8I4xPNcArCzlt0BexJ9OKSuLBnRiLNwuzTPg/exec" 
                allow="geolocation; camera; microphone"></iframe>
    </div>

    <script>
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
