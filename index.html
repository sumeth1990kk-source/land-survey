<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสำรวจข้อมูลที่ดินและแผนที่</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6;
        }
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* ไอคอนปุ่มเต็มจอวงกลม อยู่ที่มุมล่างซ้าย และจะหายไปเมื่อเข้าสู่โหมดเต็มจอ */
        #fs-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 99999;
            background: rgba(26, 115, 232, 0.9);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 20px;
            transition: background 0.2s;
        }
        #fs-btn:hover {
            background: rgb(21, 87, 176);
        }
    </style>
</head>
<body>

    <!-- ไอคอนปุ่มเปิดเต็มจอมุมล่างซ้าย -->
    <button id="fs-btn" onclick="toggleFullscreen()" title="โหมดเต็มจอ">⛶</button>

    <div class="iframe-container">
        <!-- อนุญาตให้ใช้งาน GPS และกล้อง/ไมค์ -->
        <iframe src="https://script.google.com/macros/s/AKfycbw0F6TBJYDsh7oUkRsS5o48Y6qwrvdss2WTPvcMyXb2wvzxMyi6n6GlxSJCAfwqX5-E/exec" 
                allow="geolocation; camera; microphone"></iframe>
    </div>

    <script>
        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                }
            }
        }

        // ซ่อนไอคอนอัตโนมัติเมื่อเข้าสู่โหมดเต็มจอ และแสดงกลับมาเมื่อกดออก
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fs-btn');
            if (document.fullscreenElement) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
